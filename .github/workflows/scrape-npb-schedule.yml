name: scrape-npb-schedule

on:
  schedule:
    - cron: 0 19 * * *
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "**/*.ts"
      - ".github/workflows/**"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npx tsc

      - name: Diagnose NPB connection
        continue-on-error: true
        timeout-minutes: 1
        run: |
          curl --verbose --location \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null \
            --write-out '\nremote_ip=%{remote_ip}\nhttp_code=%{http_code}\ndns_seconds=%{time_namelookup}\ntcp_seconds=%{time_connect}\ntls_seconds=%{time_appconnect}\nfirst_byte_seconds=%{time_starttransfer}\ntotal_seconds=%{time_total}\nexit_code=%{exitcode}\n' \
            "https://npb.jp/games/$(date +%Y)/schedule_03_detail.html"

      - name: Scrape
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: node dist/index.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || (git commit -m "update npb schedule on $(TZ='Asia/Tokyo' date '+%Y-%m-%d')" && git push)
